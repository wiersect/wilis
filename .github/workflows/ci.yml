name: Wilis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: ${{ matrix.os }} — Test, Audit & FFI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify zero external dependencies
        shell: bash
        run: |
          if awk '/^\[dependencies\]/{in_dep=1; next} /^\[/{in_dep=0} in_dep && /^[a-zA-Z0-9_-]+[[:space:]]*=/{print; found=1} END{exit found}' Cargo.toml; then
            echo "Verified: 0 external crate dependencies."
          else
            echo "Error: External crate dependencies are forbidden in Wilis!"
            exit 1
          fi

      - name: Run full test suite
        run: cargo test --verbose

      - name: Build optimized release binary & C-FFI shared library
        run: cargo build --release

      - name: Run scientific cryptanalysis audit & benchmark
        shell: bash
        run: |
          if [ -f ./target/release/wilis.exe ]; then
            ./target/release/wilis.exe audit
            ./target/release/wilis.exe bench
          else
            ./target/release/wilis audit
            ./target/release/wilis bench
          fi

      - name: Verify C99 FFI header compiles cleanly (-Wall -Wextra -Werror)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat > /tmp/wilis_ci_c99.c << 'EOF'
          #include <assert.h>
          #include <stdint.h>
          #include <string.h>
          #include "wilis.h"
          int main(void) {
              uint8_t pk[WILIS_KEM_PK_BYTES], sk[WILIS_KEM_SK_BYTES];
              uint8_t ct[WILIS_KEM_CT_BYTES], ss1[WILIS_KEM_SS_BYTES], ss2[WILIS_KEM_SS_BYTES];
              assert(wilis_kem_keygen(pk, sk) == WILIS_OK);
              assert(wilis_kem_encapsulate(pk, ct, ss1) == WILIS_OK);
              assert(wilis_kem_decapsulate(sk, ct, ss2) == WILIS_OK);
              assert(memcmp(ss1, ss2, WILIS_KEM_SS_BYTES) == 0);
              return 0;
          }
          EOF
          cc -std=c99 -Wall -Wextra -Werror -Iinclude /tmp/wilis_ci_c99.c -Ltarget/release -lwilis -Wl,-rpath,"$PWD/target/release" -o /tmp/wilis_ci_c99
          /tmp/wilis_ci_c99

      - name: Verify Python C-FFI binding against native libwilis
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 -B bindings/python/wilis_py.py
          else
            python -B bindings/python/wilis_py.py
          fi
