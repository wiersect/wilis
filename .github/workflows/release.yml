name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: wilis-linux-x86_64
            bin_name: wilis
            lib_name: libwilis.so
            is_windows: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: wilis-macos-arm64
            bin_name: wilis
            lib_name: libwilis.dylib
            is_windows: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: wilis-windows-x86_64
            bin_name: wilis.exe
            lib_name: wilis.dll
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run full test suite
        run: cargo test

      - name: Build release binary and shared library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix release tarball (with all 16 language bindings)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          PKG="dist/${{ matrix.asset_name }}"
          mkdir -p "$PKG/include"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$PKG/"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" "$PKG/"
          cp include/wilis.h include/wilis.hpp "$PKG/include/"
          cp -r bindings "$PKG/"
          cp README.md LICENSE SPECIFICATION.md SECURITY.md CHANGELOG.md "$PKG/"
          tar -C dist -czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          fi

      - name: Package Windows release zip (with all 16 language bindings)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          $pkg = "dist/${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Force -Path "$pkg/include" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$pkg/"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" "$pkg/"
          Copy-Item "include/wilis.h", "include/wilis.hpp" "$pkg/include/"
          Copy-Item -Recurse "bindings" "$pkg/bindings"
          Copy-Item "README.md", "LICENSE", "SPECIFICATION.md", "SECURITY.md", "CHANGELOG.md" "$pkg/"
          Compress-Archive -Path "$pkg" -DestinationPath "${{ matrix.asset_name }}.zip" -Force
          $hash = (Get-FileHash "${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ascii "${{ matrix.asset_name }}.zip.sha256"

      - name: Upload Unix release assets
        if: ${{ !matrix.is_windows }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload Windows release assets
        if: ${{ matrix.is_windows }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.zip.sha256
