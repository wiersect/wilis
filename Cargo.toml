[package]
name = "wilis"
version = "0.4.2"
edition = "2021"
authors = ["Wies <277550510+wiersect@users.noreply.github.com>"]
description = "A standalone, zero-dependency custom cryptographic suite built from scratch on the WilisPerm-384 duplex sponge permutation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/wiersect/wilis"
homepage = "https://github.com/wiersect/wilis"
keywords = ["cryptography", "aead", "post-quantum", "shamir", "zero-dependencies"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "wilis"
path = "lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "wilis"
path = "main.rs"

[dependencies]
# Intentionally empty: 100% custom implementation using only the Rust standard library.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
